spring:
  application:
    name: hiver-support-agent

  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.vertexai.gemini.VertexAiGeminiAutoConfiguration
      - org.springframework.ai.autoconfigure.vertexai.gemini.VertexAiGeminiChatAutoConfiguration

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/support_agent
    username: ${DB_USER:support_agent}
    password: ${DB_PASS:support_agent_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

app:
  brand: AppleSupport
  embeddings:
    provider: ${EMBEDDING_PROVIDER:gemini}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
      base-url: https://generativelanguage.googleapis.com/v1beta/models
  retrieval:
    top-k: 3
    similarity-threshold: ${SIMILARITY_THRESHOLD:0.35}
  escalation:
    keywords:
      - cancel
      - legal
      - lawyer
      - manager
      - supervisor
      - refund
      - complaint
      - sue
      - fraud
      - hacked
      - stolen
      - unauthorized
      - crack
      - water damage
      - liquid
    confidence-threshold: 0.60
  intents:
    taxonomy-file: classpath:intents/taxonomy.json

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.hiver.supportagent: DEBUG
    org.springframework.ai: WARN
    org.hibernate: WARN
