services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hiver-support-db
    environment:
      POSTGRES_DB: support_agent
      POSTGRES_USER: support_agent
      POSTGRES_PASSWORD: support_agent_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
